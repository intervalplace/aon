<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AON Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#090909; color:#eee; padding:32px; }
    button { padding:10px 14px; background:#eee; border:0; cursor:pointer; margin:4px; }
    input { width:720px; padding:10px; background:#111; color:#eee; border:1px solid #333; }
    .tabs button { background:#171717; color:#eee; border:1px solid #333; }
    .tabs button.active { background:#eee; color:#000; }
    .card { border:1px solid #333; border-radius:12px; padding:18px; margin:16px 0; background:#111; }
    .hash { font-family: monospace; word-break: break-all; color:#bbb; }
    .ok { color:#75ff9d; }
    .muted { color:#888; }
    pre { background:#080808; padding:12px; overflow:auto; border-radius:8px; }
  </style>
</head>
<body>
  <h1>AON Explorer</h1>

  <div class="tabs">
    <button onclick="loadTab('authorizations')" id="tab-authorizations">Open Authorizations</button>
    <button onclick="loadTab('reserves')" id="tab-reserves">Open Reserves</button>
    <button onclick="loadTab('executable')" id="tab-executable">Executable Graphs</button>
    <button onclick="loadTab('receipts')" id="tab-receipts">Receipts</button>
  </div>

  <hr />

  <input id="hash" placeholder="Paste any object hash" />
  <button onclick="loadGraph()">Load Graph</button>

  <div id="out"></div>

<script>
const AON = "http://161.97.147.176:8787";
const NS = "aon:csd-usdc";

async function get(path) {
  const res = await fetch(AON + path);
  return await res.json();
}

function setActive(tab) {
  for (const id of ["authorizations","reserves","executable","receipts"]) {
    document.getElementById(`tab-${id}`).classList.toggle("active", id === tab);
  }
}

function esc(x) {
  return String(x ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function shortHash(h) {
  if (!h) return "";
  return `${h.slice(0, 10)}…${h.slice(-8)}`;
}

function card(title, obj, extra = "") {
  if (!obj) return `<div class="card"><h2>${title}</h2><p class="muted">Missing</p></div>`;

  const id = `obj_${obj.objectHash.replaceAll("0x", "").slice(0, 12)}`;

  return `
    <div class="card">
      <h2><span class="ok">✓</span> ${esc(title)}</h2>
      <div class="hash">${esc(obj.objectHash)}</div>
      ${extra}
      <p><b>Type:</b> ${esc(obj.objectType)}</p>
      <p><b>Namespace:</b> ${esc(obj.namespace)}</p>
      <button onclick="loadGraphHash('${esc(obj.objectHash)}')">View graph</button>
      <button onclick="toggleObject('${id}')">View object</button>
      <pre id="${id}" style="display:none">${esc(JSON.stringify(obj.payload ?? obj, null, 2))}</pre>
    </div>
  `;
}

function toggleObject(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === "none" ? "block" : "none";
}
function authSummary(a) {
  return `
    <p><b>Buyer:</b> <span class="hash">${esc(a.buyer)}</span></p>
    <p><b>CSD:</b> ${esc(a.csdAmount)} · <b>USDC:</b> ${esc(a.usdcAmount)}</p>
    <p><b>Valid before:</b> ${esc(a.validBefore)}</p>
  `;
}

async function loadTab(tab) {
  setActive(tab);
  const out = document.getElementById("out");
  out.innerHTML = "Loading...";

  if (tab === "authorizations") {
    const json = await get(`/v1/authorizations/open?namespace=${encodeURIComponent(NS)}`);
    out.innerHTML = `<h2>Open Authorizations (${json.count})</h2>` +
      json.authorizations.map(a => card("Open Authorization", a, authSummary(a))).join("");
    return;
  }

  if (tab === "reserves") {
    const json = await get(`/v1/reserves/open?namespace=${encodeURIComponent(NS)}`);
    out.innerHTML = `<h2>Open Reserves (${json.count})</h2>` +
      json.reserves.map(r => card("Open Reserve", r)).join("");
    return;
  }

  if (tab === "executable") {
    const json = await get(`/v1/executable/open?namespace=${encodeURIComponent(NS)}`);
    out.innerHTML = `<h2>Executable Graphs (${json.count})</h2>` +
      json.executable.map(g => `
        <div class="card">
          <h2><span class="ok">✓</span> Executable Graph</h2>
          <p><b>Authorization:</b> <span class="hash">${esc(g.authorization?.objectHash)}</span></p>
          <p><b>Reserve:</b> <span class="hash">${esc(g.reserve?.objectHash)}</span></p>
          <p><b>Proof:</b> <span class="hash">${esc(g.proof?.objectHash)}</span></p>
          <button onclick="loadGraphHash('${esc(g.proof?.objectHash)}')">View graph</button>
        </div>
      `).join("");
    return;
  }

  if (tab === "receipts") {
    const json = await get(`/v1/receipts?namespace=${encodeURIComponent(NS)}`);
    out.innerHTML = `<h2>Receipts (${json.count})</h2>` +
      json.receipts.map(r => card("Receipt", r, `
        <p><b>Execution tx:</b> <span class="hash">${esc(r.payload?.executionTx)}</span></p>
        <p><b>Result:</b> ${esc(r.payload?.result)}</p>
      `)).join("");
    return;
  }
}

async function loadGraphHash(hash) {
  document.getElementById("hash").value = hash;
  await loadGraph();
}

async function loadGraph() {
  setActive("");
  const hash = document.getElementById("hash").value.trim();
  const out = document.getElementById("out");
  out.innerHTML = "Loading graph...";

  const root = await get(`/v1/objects/${hash}`);
  if (!root.ok) {
    out.innerHTML = `<pre>${esc(JSON.stringify(root, null, 2))}</pre>`;
    return;
  }

  const graph = await get(`/v1/graphs/${hash}`);
  const nodes = graph.graph?.nodes ?? [];

  const auth = nodes.find(x => x.objectType === "authorization") || (root.object.objectType === "authorization" ? root.object : null);
  const reserve = nodes.find(x => x.objectType === "reserve") || (root.object.objectType === "reserve" ? root.object : null);
  const proof = nodes.find(x => x.objectType === "proof") || (root.object.objectType === "proof" ? root.object : null);
  const receipt = nodes.find(x => x.objectType === "receipt") || (root.object.objectType === "receipt" ? root.object : null);

  out.innerHTML = `
    <h2>Graph</h2>
    ${card("Authorization", auth)}
    ${card("Reserve", reserve)}
    ${card("CSD Proof", proof)}
    ${card("Receipt", receipt)}
  `;
}

loadTab("receipts");
</script>
</body>
</html>
